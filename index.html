<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — Gesprekskaarten</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111110;
    --surface: #1c1c1a;
    --border: rgba(255,255,255,0.08);
    --text: #f0ede8;
    --muted: rgba(240,237,232,0.45);
    --accent-orange: #FF6B35;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }

  .container {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .icon {
    width: 96px;
    height: 96px;
    margin: 0 auto 32px;
  }

  .icon img {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    display: block;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 48px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    margin-bottom: 24px;
  }

  .card-label {
    font-size: 0.7rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .email-link {
    display: inline-block;
    color: var(--text);
    text-decoration: none;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 2px;
    transition: border-color 0.2s;
  }

  .email-link:hover {
    border-color: var(--accent-orange);
    color: var(--accent-orange);
  }

  .response-time {
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  footer {
    margin-top: 48px;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
